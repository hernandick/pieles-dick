<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Dick Pieles</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --negro:  #0C0C0C;
      --dorado: #C9A84C;
      --crema:  #F5F0E8;
    }

    body {
      background: var(--negro);
      color: var(--crema);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .wrap { max-width: 480px; }

    .codigo {
      font-family: 'Playfair Display', serif;
      font-size: 96px;
      color: var(--dorado);
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--crema);
      opacity: 0.8;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--dorado);
      color: var(--negro);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="codigo">404</div>
    <h1>Esta página no existe</h1>
    <p>La página que buscás no está disponible o fue movida. Volvé al inicio para conocer nuestros servicios de reforma y restauración de abrigos de piel.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
